# ============================================================================
# Nginx — Configuración para Laravel 12.x
# ============================================================================

server {
    listen 80;
    server_name _;
    root /app/public;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuración de archivos
    index index.php;
    charset utf-8;

    # Límites de subida (imágenes de perfil, reportes)
    client_max_body_size 10M;

    # Rutas de error
    error_page 404 /index.php;

    # Rutas de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Favicon y robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Archivos estáticos (assets construidos por Vite)
    location ~* \.(css|js|ico|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts para reportes largos (consultas InfluxDB)
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Ocultar versión de PHP
        fastcgi_hide_header X-Powered-By;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Bloquear acceso a archivos sensibles
    location ~* \.(env|log|md|txt)$ {
        deny all;
    }

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
