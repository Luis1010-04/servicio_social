# ============================================================================
# Mosquitto — Configuración para IoT_Project
# ============================================================================

# ----------------------------------------------------------------------------
# TODO SEGURIDAD: Evaluación pendiente
# Si el servidor tiene IP pública, se debe configurar autenticación.
# Por ahora se permite acceso anónimo solo para LAN interna.
# ----------------------------------------------------------------------------

# Puerto de escucha (escucha en todas las interfaces de la red interna de Docker)
listener 1883 0.0.0.0

# Permitir conexiones anónimas (solo LAN interna)
# Si el servidor tiene IP pública, cambiar a "false" y configurar passwd_file
allow_anonymous true

# Persistencia
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true

# Límites de conexión
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Límite máximo de keepalive permitido para los clientes (en segundos)
max_keepalive 60

# ----------------------------------------------------------------------------
# Configuración para producción futura (descomentar si se habilita auth)
# ----------------------------------------------------------------------------
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl